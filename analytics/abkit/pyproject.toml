[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "abkit"
version = "0.1.0"
description = "Experimentation toolkit for TravelPlan: assignment, A/B statistics, simulation checks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy==2.1.3",
  "scipy==1.14.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "ruff==0.8.4",
]
# Only to (re)freeze the G-ref golden cases; CI and abkit itself never need it.
golden = [
  "statsmodels==0.14.4",
]

[project.scripts]
abkit = "abkit.cli:main"
abkit-bench = "abkit.bench:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
