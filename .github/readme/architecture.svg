<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">TravelPlan architecture</title>
  <desc id="desc">A traveler uses the React web app on Vercel, which calls the Express API. The API enqueues jobs on Redis BullMQ queues and returns a job ID at once; BullMQ workers build the itinerary, calling Gemini for place ideas, Google Places to verify places and Mapbox for geocoding and routes, and save trips and the PlaceCache in MongoDB. Clerk handles sign-in and session checks. Workers move each trip through DRAFT, QUEUED, PROCESSING, then COMPLETED or FAILED. Product events with hashed IDs feed abkit, which writes runs.csv and runs the CI gates.</desc>
  <rect x="0" y="0" width="880" height="480" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <text x="24" y="34" font-size="16" font-weight="600" fill="#1f2328">How TravelPlan works</text>

  <!-- Request path -->
  <g stroke-width="1.5">
    <rect x="20" y="56" width="144" height="56" rx="28" fill="#f6f8fa" stroke="#8c959f"/>
    <rect x="192" y="56" width="144" height="56" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
    <rect x="364" y="56" width="144" height="56" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
    <rect x="536" y="56" width="144" height="56" rx="10" fill="#fff8c5" stroke="#d4a72c"/>
    <rect x="708" y="56" width="144" height="56" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
  </g>
  <g text-anchor="middle" fill="#1f2328">
    <text x="92" y="89" font-size="14" font-weight="600">Traveler</text>
    <text x="264" y="80" font-size="13" font-weight="600">React web app</text>
    <text x="264" y="98" font-size="11" fill="#57606a">on Vercel</text>
    <text x="436" y="80" font-size="13" font-weight="600">Express API</text>
    <text x="436" y="98" font-size="11" fill="#57606a">REST, returns a jobId</text>
    <text x="608" y="80" font-size="13" font-weight="600">Redis</text>
    <text x="608" y="98" font-size="11" fill="#57606a">BullMQ queues</text>
    <text x="780" y="80" font-size="13" font-weight="600">BullMQ workers</text>
    <text x="780" y="98" font-size="11" fill="#57606a">build the itinerary</text>
  </g>
  <g stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="164" y1="84" x2="190" y2="84"/>
    <line x1="336" y1="84" x2="362" y2="84"/>
    <line x1="508" y1="84" x2="534" y2="84"/>
    <line x1="680" y1="84" x2="706" y2="84"/>
  </g>

  <!-- Auth and storage -->
  <g stroke-width="1.5">
    <rect x="192" y="170" width="144" height="48" rx="10" fill="#f6f8fa" stroke="#8c959f"/>
    <rect x="364" y="170" width="316" height="48" rx="10" fill="#fff8c5" stroke="#d4a72c"/>
  </g>
  <g text-anchor="middle" fill="#1f2328">
    <text x="264" y="190" font-size="13" font-weight="600">Clerk auth</text>
    <text x="264" y="207" font-size="11" fill="#57606a">sign-in, session check</text>
    <text x="522" y="190" font-size="13" font-weight="600">MongoDB</text>
    <text x="522" y="207" font-size="11" fill="#57606a">trips, PlaceCache</text>
  </g>
  <g stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="264" y1="112" x2="264" y2="168" stroke-dasharray="4 3"/>
    <line x1="396" y1="112" x2="330" y2="168" stroke-dasharray="4 3"/>
    <line x1="436" y1="112" x2="436" y2="168"/>
    <line x1="720" y1="112" x2="664" y2="168"/>
  </g>

  <!-- External services called by the workers -->
  <g stroke-width="1.5" fill="#fbefff" stroke="#c297ff">
    <rect x="708" y="156" width="144" height="44" rx="10"/>
    <rect x="708" y="208" width="144" height="44" rx="10"/>
    <rect x="708" y="260" width="144" height="44" rx="10"/>
  </g>
  <g text-anchor="middle" fill="#1f2328">
    <text x="780" y="174" font-size="13" font-weight="600">Gemini</text>
    <text x="780" y="191" font-size="11" fill="#57606a">place ideas</text>
    <text x="780" y="226" font-size="13" font-weight="600">Google Places</text>
    <text x="780" y="243" font-size="11" fill="#57606a">verify places</text>
    <text x="780" y="278" font-size="13" font-weight="600">Mapbox</text>
    <text x="780" y="295" font-size="11" fill="#57606a">geocode, routes</text>
  </g>
  <g stroke="#57606a" stroke-width="1.5" fill="none">
    <polyline points="852,100 866,100 866,282"/>
    <g marker-end="url(#arrow)">
      <line x1="866" y1="178" x2="854" y2="178"/>
      <line x1="866" y1="230" x2="854" y2="230"/>
      <line x1="866" y1="282" x2="854" y2="282"/>
    </g>
  </g>

  <!-- Events into analytics -->
  <line x1="600" y1="218" x2="600" y2="370" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="592" y="290" font-size="11" text-anchor="end" fill="#57606a">product events, hashed IDs</text>

  <!-- Trip lifecycle -->
  <rect x="20" y="330" width="500" height="132" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="36" y="354" font-size="13" font-weight="600" fill="#1f2328">Trip lifecycle <tspan font-weight="400" fill="#57606a">(status set by the workers)</tspan></text>
  <g stroke-width="1.5" fill="#ffffff" stroke="#8c959f">
    <rect x="36" y="372" width="80" height="32" rx="8"/>
    <rect x="140" y="372" width="84" height="32" rx="8"/>
    <rect x="248" y="372" width="110" height="32" rx="8"/>
    <rect x="382" y="372" width="110" height="32" rx="8" fill="#dafbe1" stroke="#4ac26b"/>
    <rect x="382" y="414" width="110" height="32" rx="8" fill="#ffebe9" stroke="#ff8182"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">
    <text x="76" y="392">DRAFT</text>
    <text x="182" y="392">QUEUED</text>
    <text x="303" y="392">PROCESSING</text>
    <text x="437" y="392">COMPLETED</text>
    <text x="437" y="434">FAILED</text>
  </g>
  <g stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="116" y1="388" x2="138" y2="388"/>
    <line x1="224" y1="388" x2="246" y2="388"/>
    <line x1="358" y1="388" x2="380" y2="388"/>
    <polyline points="303,404 303,430 380,430"/>
  </g>

  <!-- Analytics -->
  <rect x="540" y="330" width="320" height="132" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="848" y="354" font-size="13" font-weight="600" text-anchor="end" fill="#1f2328">Analytics (Python)</text>
  <g stroke-width="1.5" fill="#dafbe1" stroke="#4ac26b">
    <rect x="556" y="372" width="130" height="74" rx="10"/>
    <rect x="716" y="368" width="128" height="32" rx="8"/>
    <rect x="716" y="410" width="128" height="40" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#1f2328">
    <text x="621" y="394" font-size="13" font-weight="600">abkit</text>
    <text x="621" y="412" font-size="11" fill="#57606a">A/B tests, causal</text>
    <text x="621" y="427" font-size="11" fill="#57606a">inference, forecasts</text>
    <text x="780" y="388" font-size="12" font-weight="600">runs.csv</text>
    <text x="780" y="427" font-size="12" font-weight="600">CI gates</text>
    <text x="780" y="442" font-size="10" fill="#57606a">blocks planted bugs</text>
  </g>
  <g stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="686" y1="392" x2="714" y2="384"/>
    <line x1="686" y1="420" x2="714" y2="430"/>
  </g>
</svg>
