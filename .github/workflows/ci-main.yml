name: CI - Main (Full)

on:
  push:
    branches: [main]

jobs:
  full-ci:
    name: Full CI + Unit Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: test_user
          MONGO_INITDB_ROOT_PASSWORD: test_password
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Lint
        run: npm run lint
        env:
          CI: true

      - name: Typecheck
        run: npm run typecheck
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          CI: true
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_dummy_key_for_ci
          VITE_API_URL: http://localhost:3000/api
          VITE_MAPBOX_ACCESS_TOKEN: pk.dummy_token_for_ci

      - name: Unit Tests
        # CLERK_WEBHOOK_SIGNING_SECRET is computed here, not a static env:
        # value — must be valid base64 after "whsec_" (svix's Webhook
        # constructor throws otherwise, see backend/src/test/integration-setup.ts),
        # and a hardcoded base64 blob reads as a real secret to entropy-based
        # scanners (GitGuardian false positive) even though it's a fixture.
        # Kept in sync with ci-pr.yml's "Unit Tests - Backend + Frontend" step.
        run: |
          export CLERK_WEBHOOK_SIGNING_SECRET="whsec_$(printf '%s' 'integration-test-clerk-webhook-secret-32' | base64 -w0)"
          npm run test
        env:
          CI: true
          NODE_ENV: test
          MONGO_URI: mongodb://test_user:test_password@localhost:27017/test_db?authSource=admin
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          CLERK_SECRET_KEY: sk_test_dummy_key_for_ci
          GEMINI_API_KEY: sk-dummy-key-for-ci
          STRIPE_SECRET_KEY: sk_test_dummy_key_for_ci
          STRIPE_WEBHOOK_SECRET: whsec_test_xxxxxxxxxxxxxxxxxxxxxxxx

      - name: Backend Integration Tests
        # See the Unit Tests step above for why this is computed, not static.
        run: |
          export CLERK_WEBHOOK_SIGNING_SECRET="whsec_$(printf '%s' 'integration-test-clerk-webhook-secret-32' | base64 -w0)"
          npm run test:integration -w backend
        env:
          CI: true
          NODE_ENV: test
          MONGO_URI: mongodb://test_user:test_password@localhost:27017/test_db?authSource=admin
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          CLERK_SECRET_KEY: sk_test_dummy_key_for_ci
          GEMINI_API_KEY: sk-dummy-key-for-ci
          STRIPE_SECRET_KEY: sk_test_dummy_key_for_ci
          STRIPE_WEBHOOK_SECRET: whsec_test_xxxxxxxxxxxxxxxxxxxxxxxx

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-main-${{ github.run_id }}
          path: |
            backend/coverage/
            frontend/web/coverage/
          retention-days: 14

# Real sensitive env vars (JWT/API key/DB credential) should use ${{ secrets.XXX }} when
# this workflow needs to run real integration/e2e — for now it only uses dummy values
# sufficient for build/test to pass without real secrets.
