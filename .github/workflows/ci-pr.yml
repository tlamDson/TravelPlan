name: CI - PR Check

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # Auxiliary job, NOT a required check — only tells us whether the PR touches the backend,
  # and is used to gate the Docker image build step cheaply. Do NOT use it to gate the "ci"/"quality" jobs
  # (a required check must always run; see .claude/rules/workflow.md).
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}

    steps:
      - name: Detect backend-related changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
              - '.dockerignore'
              - '.github/workflows/ci-pr.yml'

  ci:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: test_user
          MONGO_INITDB_ROOT_PASSWORD: test_password
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Lint
        run: npm run lint
        env:
          CI: true

      - name: Unit Tests - Backend + Frontend
        # CLERK_WEBHOOK_SIGNING_SECRET is computed here, not a static env:
        # value — must be valid base64 after "whsec_" (svix's Webhook
        # constructor throws otherwise, see backend/src/test/integration-setup.ts),
        # and a hardcoded base64 blob reads as a real secret to entropy-based
        # scanners (GitGuardian false positive) even though it's a fixture.
        run: |
          export CLERK_WEBHOOK_SIGNING_SECRET="whsec_$(printf '%s' 'integration-test-clerk-webhook-secret-32' | base64 -w0)"
          npm run test
        env:
          CI: true
          NODE_ENV: test
          MONGO_URI: mongodb://test_user:test_password@localhost:27017/test_db?authSource=admin
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          CLERK_SECRET_KEY: sk_test_dummy_key_for_ci
          GEMINI_API_KEY: sk-dummy-key-for-ci
          STRIPE_SECRET_KEY: sk_test_dummy_key_for_ci
          STRIPE_WEBHOOK_SECRET: whsec_test_xxxxxxxxxxxxxxxxxxxxxxxx

      # Reuses this job's mongo/redis services — real DB/queue, no mocks.
      - name: Backend Integration Tests
        # See the Unit Tests step above for why this is computed, not static.
        run: |
          export CLERK_WEBHOOK_SIGNING_SECRET="whsec_$(printf '%s' 'integration-test-clerk-webhook-secret-32' | base64 -w0)"
          npm run test:integration -w backend
        env:
          CI: true
          NODE_ENV: test
          MONGO_URI: mongodb://test_user:test_password@localhost:27017/test_db?authSource=admin
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          CLERK_SECRET_KEY: sk_test_dummy_key_for_ci
          GEMINI_API_KEY: sk-dummy-key-for-ci
          STRIPE_SECRET_KEY: sk_test_dummy_key_for_ci
          STRIPE_WEBHOOK_SECRET: whsec_test_xxxxxxxxxxxxxxxxxxxxxxxx

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: |
            backend/coverage/
            frontend/web/coverage/
          retention-days: 7

  # Separate job so the required check name "Lint + Unit Tests" is not changed
  quality:
    name: Typecheck + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Typecheck
        run: npm run typecheck
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          CI: true
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_dummy_key_for_ci
          VITE_API_URL: http://localhost:3000/api
          VITE_MAPBOX_ACCESS_TOKEN: pk.dummy_token_for_ci

  # Python analytics/abkit (B2 plan, PR 9). The job name is the required check name:
  # do not rename it, do not put `if:` at job level — it always runs (fast: core + dev only).
  abkit:
    name: abkit Lint + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics/abkit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            analytics/abkit/pyproject.toml
            analytics/simkit/pyproject.toml

      - name: Install abkit (core + dev)
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Pytest
        run: python -m pytest -q

      # Golden gate (B2 plan, PR 15a): G-ref + one G-sim case per group (subset ci-fast),
      # then the 10 mutants planted in the engine must each fail it (M10). G-event replay is
      # the step after the simkit install. Every case runs nightly (abkit-golden-nightly.yml).
      - name: Golden gate (G-ref + G-sim ci-fast)
        run: python -m abkit golden --subset ci-fast --strict

      - name: Golden gate mutants (M10)
        run: python -m abkit gate

      # analytics/simkit (B2 plan, PR 13) needs abkit installed first (step above).
      - name: Install simkit (core + dev)
        working-directory: analytics/simkit
        run: python -m pip install -e ".[dev]"

      - name: Golden gate (G-event replay)
        working-directory: analytics/simkit
        run: python -m pytest -q tests/test_catalog.py

      - name: simkit Ruff lint
        working-directory: analytics/simkit
        run: python -m ruff check .

      - name: simkit Ruff format
        working-directory: analytics/simkit
        run: python -m ruff format --check .

      - name: simkit Pytest
        working-directory: analytics/simkit
        run: python -m pytest -q

  # This image is what gets deployed to Railway — if it breaks here, the whole deploy breaks
  docker:
    name: Backend Docker Build
    runs-on: ubuntu-latest
    needs: changes
    # Do NOT put `if:` at job level and do NOT rename the job: it is a required status check.
    # The job must always run and always finish Success; only the heavy steps are gated with `if:`.
    env:
      # A develop → main release PR always does a real build, without trusting the filter
      SHOULD_BUILD: ${{ needs.changes.outputs.backend == 'true' || github.base_ref == 'main' }}

    steps:
      - name: Checkout
        if: env.SHOULD_BUILD == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: env.SHOULD_BUILD == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        if: env.SHOULD_BUILD == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          target: production
          push: false
          tags: travelplan-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Skip image build
        if: env.SHOULD_BUILD != 'true'
        run: echo "PR does not touch backend, packages/shared or the root manifests — skipping image build."

  # Not a required check — reports vulnerabilities, does not block merge.
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"
          exit-code: "0"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # Not a required check — do NOT add this job to branch protection.
  # A red result here does not block merge; see the required-check section of
  # .claude/rules/workflow.md before considering changing that.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Secrets are not available to fork PRs — skip instead of failing confusingly.
    if: github.event.pull_request.head.repo.full_name == github.repository

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: travelplan_admin
          MONGO_INITDB_ROOT_PASSWORD: dev_password_change_in_prod
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E (CI-safe specs only — @live is local-only, needs real Gemini/Places keys)
        # See the Unit Tests step above for why CLERK_WEBHOOK_SIGNING_SECRET
        # is computed here, not a static env: value.
        run: |
          export CLERK_WEBHOOK_SIGNING_SECRET="whsec_$(printf '%s' 'integration-test-clerk-webhook-secret-32' | base64 -w0)"
          npm run e2e
        env:
          CI: true
          E2E_MONGO_URI: mongodb://travelplan_admin:dev_password_change_in_prod@localhost:27017/travelplan_e2e?authSource=admin
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          CLERK_PUBLISHABLE_KEY_E2E: ${{ secrets.CLERK_PUBLISHABLE_KEY_E2E }}
          CLERK_SECRET_KEY_E2E: ${{ secrets.CLERK_SECRET_KEY_E2E }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          GEMINI_API_KEY: sk-dummy-key-for-ci
          STRIPE_SECRET_KEY: sk_test_dummy_key_for_ci
          STRIPE_WEBHOOK_SECRET: whsec_test_xxxxxxxxxxxxxxxxxxxxxxxx
          # Intentionally absent: GOOGLE_PLACES_API_KEY, MAPBOX_ACCESS_TOKEN,
          # VITE_API_URL (axios.ts defaults to http://localhost:3000/api —
          # setting it to http://localhost:3000 like the `quality` job's
          # build step does would 404 every request).

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
