name: MongoDB Backup

on:
  schedule:
    # Daily at 01:00 UTC — one hour before data-pipeline.yml's bulk-write
    # slot (02:00 UTC on the 1st/15th), so that scheduled ETL run never lands
    # against unprotected data. See backend/scripts/BACKUP.md for restore.
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  backup:
    # Pinned on purpose: the floating latest image moved to 26.04 ("resolute"), for
    # which MongoDB publishes no apt repo, and this job failed every run. Bump deliberately.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      # Pinned tgz from MongoDB's download server, verified by checksum — no apt
      # repo, so it does not depend on the runner's Ubuntu codename.
      - name: Install MongoDB Database Tools
        env:
          TOOLS_VERSION: "100.10.0"
          TOOLS_SHA256: "18ee7d64e11d7b6a7c37ede529ca051cabb7a99b14298108e738b0fb91747ea9"
        run: |
          TGZ="mongodb-database-tools-ubuntu2404-x86_64-${TOOLS_VERSION}.tgz"
          curl -fsSL -o "$RUNNER_TEMP/$TGZ" "https://fastdl.mongodb.org/tools/db/$TGZ"
          echo "${TOOLS_SHA256}  $RUNNER_TEMP/$TGZ" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$TGZ" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/mongodb-database-tools-ubuntu2404-x86_64-${TOOLS_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify mongodump is installed
        run: bash backend/scripts/require-mongodump.sh

      # ─── Backup ──────────────────────────────────────────────────────
      # Soft-skips (exit 0, no Discord alert) if the S3/R2 secrets below
      # aren't configured yet — see backend/scripts/backup-mongo.sh. Only a
      # missing MONGO_URI, a failed mongodump, or an unexpectedly small
      # archive (empty/wrong-database dump) is treated as a real failure.
      - name: Run Backup
        working-directory: ./backend
        run: bash scripts/backup-mongo.sh
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}

      # ─── Discord Alert: Notify on failure ──────────────────────────────
      # Requires the same DISCORD_WEBHOOK secret data-pipeline.yml uses
      # (Server Settings → Integrations → Webhooks → New Webhook → Copy URL).
      - name: Send Discord Alert
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{
            "content": "🚨 **[TravelPlan] MongoDB Backup Failed!** 🚨\n\n**Repository:** `${{ github.repository }}`\n**Branch:** `${{ github.ref_name }}`\n**Run ID:** `${{ github.run_id }}`\n\n🔗 **[Click here to view full logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})**\n\n_Backup failed — check MONGO_URI, bucket credentials, or whether the dump is unexpectedly empty._"
          }' \
          $DISCORD_WEBHOOK
