name: Monthly City Budget ETL Pipeline

on:
  schedule:
    # Run at 02:00 UTC on the 1st and 15th of every month
    - cron: "0 2 1,15 * *"
  # Allow manual triggering from the GitHub Actions UI
  workflow_dispatch:

jobs:
  scrape-city-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./backend/package-lock.json"

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Execute City Cost Scraper Script
        working-directory: ./backend
        run: npx tsx scripts/city-cost-scraper.ts
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          YELP_API_KEY: ${{ secrets.YELP_API_KEY }}
          AMADEUS_API_KEY: ${{ secrets.AMADEUS_API_KEY }}
          AMADEUS_API_SECRET: ${{ secrets.AMADEUS_API_SECRET }}

      # ─── Discord Alert: Notify on failure ──────────────────────────────
      # Triggered ONLY when the scraper step above fails.
      # Requires one GitHub Repository Secret:
      #   DISCORD_WEBHOOK — Webhook URL from your Discord server channel settings
      #   (Server Settings → Integrations → Webhooks → New Webhook → Copy URL)
      - name: Send Discord Alert
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{
            "content": "🚨 **[TravelPlan] City Budget ETL Pipeline Failed!** 🚨\n\n**Repository:** `${{ github.repository }}`\n**Branch:** `${{ github.ref_name }}`\n**Run ID:** `${{ github.run_id }}`\n\n🔗 **[Click here to view full logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})**\n\n_Please check the logs to see whether the API changed its structure or the database is down._"
          }' \
          $DISCORD_WEBHOOK
